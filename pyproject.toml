[project]
name = "automation"
version = "0.1.0"
description = "SECOM process anomaly detection, explanation, and human verification"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "pandas>=2.2,<3",
  "pydantic-settings>=2.6,<3",
  "scikit-learn>=1.5,<2",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "pytest>=8.3,<9", "ruff>=0.8,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[project.scripts]
automation-eda = "app.data.eda:main"
automation-spc = "app.evaluation.baseline:main"
automation-compare = "app.evaluation.compare:main"

[tool.setuptools.packages.find]
include = ["app*"]

